<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080912"/>
      <stop offset="100%" stop-color="#161a2c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <rect width="188" height="188" x="2" y="2" rx="40" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Glowing Chart Wave & Star Badge -->
  <path d="M 36 128 L 72 96 L 108 116 L 156 56" fill="none" stroke="url(#neon)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Center Star -->
  <circle cx="156" cy="56" r="10" fill="#00f0ff" filter="url(#glow)"/>
  
  <!-- Text Label -->
  <text x="96" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="2">IPO 10★</text>
</svg>
